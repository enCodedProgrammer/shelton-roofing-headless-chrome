<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Shelton Roofing postcard — FRONT panel (6x9 landscape, full bleed).
  Rendered by the Puppeteer service to a 2775x1875 PNG.
  Tokens ({{...}}) are replaced by the n8n "Build Postcard HTML" node.
  QA literals present below: 2775px and 1875px. Two base64 <img> (before + after).

  Style mirrors "postcard front.jpeg": black BEFORE pennant (points right),
  gold AFTER pennant (points left), gold circular arrow badge over the divider.
  Google's satellite images are square; object-fit:cover fills each pane without
  stretching (crops the sides of the square, keeping the centered house).
-->
<style>
  /* Montserrat is installed as an OS font in the render container (Dockerfile).
     The @import is a dev/local fallback so previews look right off-container. */
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');

  :root{
    --navy:#0D2444;
    --gold:#F5B91E;
    --red:#E33329;
    --ink:#0B0B0B;
    --paper:#FFFFFF;
    --mist:#F2F5F9;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:2775px; height:1875px;   /* QA literals: 2775px 1875px — do not refactor */
    margin:0; overflow:hidden;
    background:var(--ink);
    font-family:'Montserrat', Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  @page{ size:2775px 1875px; margin:0; }

  .board{ position:absolute; inset:0; }

  /* ---- 50/50 full-bleed before / after split ---- */
  .split{ position:absolute; inset:0; display:flex; }
  .pane{
    position:relative;
    width:1387.5px; height:1875px;
    overflow:hidden;
    background:var(--ink);
  }
  .pane .photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center center;   /* no stretch: crop square to fill */
    display:block;
  }

  /* thin white center rule */
  .divider{
    position:absolute; top:0; bottom:0; left:50%;
    width:12px; transform:translateX(-50%);
    background:#fff; z-index:6;
    box-shadow:0 0 24px rgba(0,0,0,.25);
  }

  /* ---- BEFORE / AFTER pennant flags ---- */
  .flag{
    position:absolute; top:160px; z-index:7;
    height:120px; display:flex; align-items:center;
    font-weight:800; font-size:72px; letter-spacing:5px; line-height:1;
    box-shadow:0 12px 34px rgba(0,0,0,.42);
  }
  .flag.before{
    left:0; padding:0 96px 0 150px;
    background:var(--ink); color:#fff;
    clip-path:polygon(0 0, calc(100% - 48px) 0, 100% 50%, calc(100% - 48px) 100%, 0 100%);
  }
  .flag.after{
    right:0; padding:0 150px 0 96px;
    background:var(--gold); color:var(--ink);
    clip-path:polygon(48px 0, 100% 0, 100% 100%, 48px 100%, 0 50%);
  }

  /* ---- center gold arrow badge (over the divider) ---- */
  .arrow-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:8; width:180px; height:180px; border-radius:50%;
    background:var(--gold); border:11px solid #0B0B0B;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .arrow-badge svg{ width:96px; height:96px; display:block; }

  /* ---- bottom scrim with headline + property address ---- */
  /* Strong bottom scrim: near-solid at the base so a white address survives the
     worst-case bottom crop (pale concrete, light roof, bright grass), not just a
     dark one. Text also rides on its own semi-opaque plate for guaranteed contrast. */
  .scrim{
    position:absolute; left:0; right:0; bottom:0; height:520px; z-index:7;
    background:linear-gradient(to top,
        rgba(8,17,34,.99) 0%,
        rgba(8,17,34,.98) 20%,
        rgba(8,17,34,.86) 42%,
        rgba(8,17,34,.40) 72%,
        rgba(8,17,34,0) 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding:0 140px 120px;      /* bottom 120px keeps text off the trim edge */
    text-align:center;
  }
  .scrim .plate{
    background:rgba(8,17,34,.62); border:1px solid rgba(255,255,255,.08);
    border-radius:22px; padding:24px 58px 30px;
  }
  .scrim .kicker{
    color:#fff; font-weight:600; font-size:46px; letter-spacing:.5px;
    opacity:.96; margin-bottom:20px;
    text-shadow:0 2px 10px rgba(0,0,0,.95);
  }
  .scrim .address{
    color:#fff; font-weight:800; font-size:60px; letter-spacing:1px;
    text-shadow:0 2px 12px rgba(0,0,0,.98);
  }

  /* ---- Static Maps attribution (required) — on its own dark chip so it stays
     legible over light concrete/grass at the bottom-left corner. ---- */
  .attribution{
    position:absolute; left:130px; bottom:44px; z-index:8;
    color:#fff; font-weight:500; font-size:24px; letter-spacing:.3px;
    background:rgba(8,17,34,.6); padding:9px 18px; border-radius:9px;
    text-shadow:0 1px 4px rgba(0,0,0,1);
  }
</style>
</head>
<body>
  <div class="board">
    <div class="split">
      <div class="pane">
        <img class="photo" src="{{before_image_url}}" alt="Roof before">
      </div>
      <div class="pane">
        <img class="photo" src="{{after_image_url}}" alt="Roof after — new roof preview">
      </div>
    </div>

    <div class="divider"></div>

    <div class="flag before">BEFORE</div>
    <div class="flag after">AFTER</div>

    <div class="arrow-badge">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 50 H74 M74 50 L54 30 M74 50 L54 70"
              fill="none" stroke="#0B0B0B" stroke-width="12"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="scrim">
      <div class="plate">
        <div class="kicker">See your home with a brand-new roof.</div>
        <div class="address">{{property_label}}</div>
      </div>
    </div>

    <div class="attribution">{{attribution}}</div>
  </div>
</body>
</html>
